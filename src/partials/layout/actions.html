<div class="header-actions">
    <button
        type="button"
        class="login-button"
        data-auth-open="login"
        aria-label="Anmelden"
    >
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" />
        </svg>
    </button>

    <button
        type="button"
        class="join-button"
        data-auth-open="signup"
    >
        <span class="crown"> ♛ </span>

        Jetzt beitreten
    </button>

    <div class="auth-user">
        <span class="auth-user__avatar" id="auth-user-avatar" aria-hidden="true"></span>

        <span class="auth-user__name" id="auth-user-name"></span>

        <button
            type="button"
            class="auth-user__logout"
            id="auth-logout"
        >
            Abmelden
        </button>
    </div>
</div>
