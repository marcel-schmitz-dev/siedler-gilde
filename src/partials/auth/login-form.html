<form id="login-form" class="auth-form" novalidate hidden>
    <label class="auth-field">
        <span>E-Mail</span>
        <input
            type="email"
            name="email"
            placeholder="name@beispiel.de"
            autocomplete="email"
            required
        />
    </label>

    <label class="auth-field">
        <span>Passwort</span>
        <input
            type="password"
            name="password"
            autocomplete="current-password"
            required
        />
    </label>

    <button type="submit" class="auth-submit">
        <span>♛</span> Anmelden
    </button>
</form>
