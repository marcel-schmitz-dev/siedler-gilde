<div class="auth-modal" id="auth-modal" hidden>
    <div class="auth-modal__backdrop" data-auth-close></div>

    <div
        class="auth-modal__dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="auth-title"
    >
        <button
            type="button"
            class="auth-modal__close"
            data-auth-close
            aria-label="Fenster schließen"
        >
            ×
        </button>

        <img
            class="auth-modal__crest"
            src="./assets/img/logo/gvg-wappen.webp"
            alt="Wappen der Gründer von Goldenau"
        />

        <span class="auth-modal__eyebrow">Die Siedler Online Gilde</span>

        <h2 id="auth-title">Werde Teil der Gilde</h2>

        <div class="auth-tabs" role="tablist">
            <button
                type="button"
                class="auth-tab is-active"
                role="tab"
                aria-selected="true"
                data-auth-view="signup"
            >
                Registrieren
            </button>

            <button
                type="button"
                class="auth-tab"
                role="tab"
                aria-selected="false"
                data-auth-view="login"
            >
                Anmelden
            </button>
        </div>

        <!-- REGISTRIEREN -->

        <!-- @include partials/auth/signup-form.html -->

        <!-- ANMELDEN -->

        <!-- @include partials/auth/login-form.html -->

        <p class="auth-message" id="auth-message" role="alert"></p>
    </div>
</div>
